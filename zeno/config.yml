snippets:
  - name: open
    keyword: o
    snippet: open
    context:
      lbuffer: "^o$"
  - name: open localhost
    keyword: local
    snippet: "http://localhost:{{}}"
    context:
      lbuffer: '^open\s+local$'
  - name: ssh hosts
    keyword: sshli
    snippet: "cat ~/.ssh/config | grep '^Host ' | sed -e 's/^Host //g'"
  - name: nvim
    keyword: nv
    snippet: nvim
  - name: docker compose
    keyword: dc
    snippet: docker compose
  - name: docker ps
    keyword: dps
    snippet: docker ps --format "table {{ .Names }}\t{{ .Status }}\t{{ .Ports }}"
  - name: docker ps all
    keyword: dpsa
    snippet: docker ps -a
  - name: docker images
    keyword: dil
    snippet: docker images
  - name: docker compose logs
    keyword: dclog
    snippet: docker compose logs -f --no-log-prefix
  - name: docker compose exec
    keyword: dcex
    snippet: docker compose exec -it
  - name: docker rm
    keyword: drm
    snippet: docker rm
  - name: docker rmi
    keyword: dri
    snippet: docker rmi
  - name: docker cleanup
    keyword: dcl
    snippet: >-
      docker system df &&
      docker volume ls -qf dangling=true | xargs -r docker volume rm &&
      docker images -f 'dangling=true' -q | xargs -r docker rmi &&
      docker container prune --force --filter 'until=168h' &&
      docker ps --filter 'status=exited' | grep 'weeks ago' | awk '{print $1}' | xargs -r docker rm &&
      docker builder prune &&
      docker system df
  - name: pnpm
    keyword: pn
    snippet: pnpm
  - name: git status
    keyword: st
    snippet: status -u -s
    context:
      lbuffer: '^git\s+'
  - name: git log oneline
    keyword: logo
    snippet: log --oneline
    context:
      lbuffer: '^git\s+'
  - name: git log name status
    keyword: logn
    snippet: log --name-status --oneline
    context:
      lbuffer: '^git\s+'
  - name: git log graph
    keyword: lg
    snippet: >-
      log --graph --all --date-order
      --pretty=format:"%C(yellow)%h%C(reset) - %C(bold red)%d%C(reset) %s %C(green)(%ad)%C(reset) %C(bold blue)<%an>%C(reset)"
      --date=format-local:"%Y/%m/%d %H:%M"
    context:
      lbuffer: '^git\s+lg$'
  - name: git fetch prune all
    keyword: fp
    snippet: fetch --prune --all
    context:
      lbuffer: '^git\s+'
  - name: git switch
    keyword: sw
    snippet: switch
    context:
      lbuffer: '^git\s+'
  - name: git branch delete
    keyword: bd
    snippet: branch -D
    context:
      lbuffer: '^git\s+'
  - name: git commit
    keyword: ci
    snippet: commit
    context:
      lbuffer: '^git\s+'
  - name: git commit amend
    keyword: ame
    snippet: commit --amend
    context:
      lbuffer: '^git\s+'
  - name: git diff
    keyword: di
    snippet: diff
    context:
      lbuffer: '^git\s+'
  - name: git diff staged
    keyword: di-s
    snippet: diff --staged
    context:
      lbuffer: '^git\s+'
  - name: git add all
    keyword: aa
    snippet: add .
    context:
      lbuffer: '^git\s+'
  - name: git restore
    keyword: res
    snippet: restore
    context:
      lbuffer: '^git\s+'
  - name: git restore staged
    keyword: ress
    snippet: restore --staged
    context:
      lbuffer: '^git\s+'

completions:
  - name: localhost port
    patterns:
      - "^open http://localhost:$"
    sourceCommand: >-
      lsof -nP -iTCP -sTCP:LISTEN -Fpcn 2>/dev/null |
      awk '/^c/ { command = substr($0, 2) }
      /^n/ { port = $0; sub(/^.*:/, "", port);
      if (port ~ /^[0-9]+$/ && !seen[port SUBSEP command]++)
      printf "%s\t%s\n", port, command }' |
      sort -n -k1,1 -k2,2
    options:
      --prompt: "'localhost port > '"
      --no-multi: true
    callback: "awk '{print $1}'"
  - name: aws cli completer
    patterns:
      - '^\s*(?:[A-Z_]+=\S+\s+)*aws(?:$|\s.*)$'
    sourceCommand: 'LINE="${LBUFFER}${RBUFFER}"; CLEAN=$(perl -pe "s/^\s*(?:[A-Z_]+=\S+\s+)+//" <<< "$LINE"); OFF=$((${#LINE}-${#CLEAN})); COMP_LINE="$CLEAN" COMP_POINT=$((${#LBUFFER}-OFF)) aws_completer 2>/dev/null'
    options:
      --prompt: "'aws > '"
  - name: gh browse
    patterns:
      - "^gh browse -R( .*)? $"
    sourceCommand: "gh repo list --archived=false --limit 100 | awk '{print $1}'"
    options:
      --prompt: "'browse repo >'"
  - name: gh issue ID
    patterns:
      - "^gh issue (view|edit|close|open)? $"
    sourceCommand: "gh issue ls --limit 100"
    options:
      --prompt: "'Issue ID> '"
    callback: "awk '{print $1}'"