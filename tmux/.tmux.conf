set-option -g mouse on
set-window-option -g mode-keys vi
set -g default-terminal "tmux-256color"
set-option -ga terminal-overrides ",xterm-256color:Tc"
set -g history-limit 50000
set -s escape-time 0

# ------------------------------------------------------------------------------
# KEY BINDINGS
# ------------------------------------------------------------------------------

# Prefix
set -g prefix C-g
bind C-g send-prefix

# Pane resizing (without prefix)
bind-key -n M-Up resize-pane -U 3
bind-key -n M-Down resize-pane -D 3
bind-key -n M-Left resize-pane -L 3
bind-key -n M-Right resize-pane -R 3

# Copy mode
bind -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection

# Pane navigation (Neovim-aware; F1-F4 are internal signals)
# Use tmux's format matching instead of if-shell to avoid process spawning.
is_vim='#{m/ri:^(\S+/)?g?(view|n?vim?x?)(diff)?$,#{pane_current_command}}'
bind h if -F "$is_vim" "send-keys F1" "select-pane -L"
bind j if -F "$is_vim" "send-keys F2" "select-pane -D"
bind k if -F "$is_vim" "send-keys F3" "select-pane -U"
bind l if -F "$is_vim" "send-keys F4" "select-pane -R"

# Popups
# Prefix + t: toggle a floating terminal in the current directory.
bind t display-popup -E -w 80% -h 80% -d "#{pane_current_path}"
bind g display-popup -E -w 80% -h 80% "tmux new-session -A -s scratch"
bind / run-shell "tmux display-popup -E -w 80% -h 80% 'tmux capture-pane -e -J -pS -10000 -t #{pane_id} | fzf --ansi --multi --tac | perl -pe \"s/\\\\x1b\\\\[[0-9;]*[a-zA-Z]//g\" | pbcopy'"

# Configuration
bind-key r source-file ~/.tmux.conf \; display-message "Config reloaded!"

# Turn Off Visual Notifications
setw -g monitor-activity off
set -g visual-activity on

# Transparent background (pass-through to Alacritty)
set -g window-style 'bg=default'
set -g window-active-style 'bg=default'
set -g pane-active-border-style "fg=themelightgrey"

# Neovimへの反映サポート
set-option -g focus-events on

# Status bar
set -g status-interval 5
set -g status-style "bg=#E8E6E4,fg=#8a8980"
set -g status-bg "#E8E6E4"
set -g status-fg "#8a8980"
set -g status-left "#{?client_prefix,#[bg=#545464#,fg=#E8E6E4#,bold] #S ,#[bg=#E8E6E4#,fg=#545464] #S }"
set -g status-left-style "bg=#E8E6E4,fg=#545464"
set -g status-left-length 20
set -g status-right " #{e|+|:1,#{window_index}}/#{session_windows} | %Y/%m/%d %H:%M "
set -g status-right-style "bg=#E8E6E4,fg=#8a8980"
set -g status-right-length 40
set -g window-status-style "bg=#E8E6E4,fg=#8a8980"
set -g window-status-current-style "bg=#545464,fg=#E8E6E4,bold"

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'fcsonline/tmux-thumbs'
set -g @thumbs-select-bg-color '#545464'
set -g @thumbs-select-fg-color '#E8E6E4'
run-shell ~/.tmux/plugins/tmux-thumbs/tmux-thumbs.tmux
run '~/.tmux/plugins/tpm/tpm'