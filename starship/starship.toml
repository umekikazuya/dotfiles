[battery]
disabled = true

format = """
$directory\
$git_branch\
$git_status\
$direnv\
$python\
$aws\
$fill\
$cmd_duration\
$time\
\n$character\
"""

[fill]
symbol = '─'

[directory]
truncation_length = 6
truncation_symbol = ' '
truncate_to_repo = false
home_symbol = '~'
read_only = ' 󰌾 '
style = 'bold fg:#313244'
read_only_style = 'bold fg:#313244'
format = """
[$path]($style) \
[$read_only]($read_only_style) \
"""

[gcloud]
disabled = true

[aws]
format = '[$symbol $profile ]($style)'
symbol = "💭"
style = "bold fg:#ffcb6b"

[character]
success_symbol = "[❯](purple)"
error_symbol = "[❯](red)"
vimcmd_symbol = '[V](bold green) '

[git_branch]
symbol = ""
style = "fg:#769ff0"
format = """
[$symbol $branch]($style)\
"""

[git_status]
style = "fg:#769ff0"
format = """
[$all_status$ahead_behind]($style)\
"""

[cmd_duration]
format = "[$duration]($style) "
style = "yellow"